services:
  bookstack:
    image: linuxserver/bookstack:26.09.1
    ports:
      - "8080:80"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      APP_URL: http://localhost:8080
      APP_KEY: ${BOOKSTACK_APP_KEY:-base64:RjxEFNSjkBjSzXzjM82P6rRsGwuRKwm5LfbFD+c3YPE=}
      DB_HOST: db
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:-shippy-local-dev}
      DB_DATABASE: bookstack
    volumes:
      - bookstack_uploads:/config
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_ROOT_PASSWORD: ${BOOKSTACK_DB_PASSWORD:-shippy-local-dev}
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:-shippy-local-dev}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  bookstack_uploads:
  db_data:
