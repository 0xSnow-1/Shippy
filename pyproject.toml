[project]
name = "internal-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "fastapi",
    "uvicorn",
    "langchain-aws",
    "chromadb",
    "rank_bm25",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "respx",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
